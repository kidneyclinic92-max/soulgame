# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - soulgame

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install and build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          npm install
          npm run build

      - name: Package standalone as zip
        run: |
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../..
          echo "=== Zip contents (first 30 entries) ==="
          zipinfo deploy.zip | head -30

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'soulgame'
          slot-name: 'Production'
          package: deploy.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2337E5DBC86E4CC4B850C6BA315F7184 }}
